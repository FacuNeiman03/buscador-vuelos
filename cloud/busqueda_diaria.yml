name: Búsqueda de vuelos
# Título de cada ejecución (lo muestra la web en el indicador "buscando…")
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.busqueda != '' && format('Buscar {0}', inputs.busqueda) || 'Buscar todas') || 'Búsqueda programada' }}

# Corre cada hora, pero solo busca las búsquedas a las que les toca (su 'hora', su ventana
# buscar_desde/buscar_hasta, y que hoy no hayan corrido). Si no toca nada, termina en segundos.
# La web (Render) también la dispara a pedido con el botón "Actualizar" (workflow_dispatch).
on:
  schedule:
    # Dos veces por hora: GitHub demora o saltea muchos cron en repos chicos, así hay más chances.
    # Para que sea puntual, un servicio externo (cron-job.org) puede dispararlo con modo=programado.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      busqueda:
        description: "Nombre de UNA búsqueda (vacío = todas las activas)"
        required: false
        default: ""
      modo:
        description: "manual = buscar ya · programado = solo lo que toca a esta hora (para cron externo)"
        type: choice
        options: [manual, programado]
        default: manual
      proveedor:
        description: "De dónde sacar precios"
        type: choice
        options: [config, auto, fast_flights, serpapi]
        default: config

permissions:
  contents: write     # guarda historial.db y reportes en la rama "datos"

env:
  TZ: America/Argentina/Buenos_Aires

jobs:
  # Liviano y sin cola: decide si hay algo para buscar. Así las ejecuciones horarias sin trabajo
  # nunca entran a la cola de "buscar" (no cancelan un pedido manual que esté esperando).
  decidir:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 el 19/10/2026
    timeout-minutes: 10
    outputs:
      hay: ${{ steps.decidir.outputs.hay }}
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar historial (rama "datos")
        run: |
          # El historial vive en una rama aparte que se PISA en cada corrida (un solo commit),
          # así el repo no crece con una copia de la base por día.
          if git fetch --depth=1 origin datos 2>/dev/null; then
            mkdir -p data reportes
            git archive FETCH_HEAD | tar -x   # la rama solo tiene data/ y reportes/
            echo "Historial restaurado"
          else
            echo "Todavía no hay rama datos: primera corrida"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ¿Toca buscar algo ahora?
        id: decidir
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.modo }}" != "programado" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"; echo "Pedido manual desde la web"
          else
            pip install -q pyyaml
            python -m src.core.programacion
          fi

      - name: Mantener vivo el cron
        if: github.event_name == 'schedule' || inputs.modo == 'programado'
        run: |
          # GitHub pausa los cron de repos sin commits en 60 días. Si main lleva 45 días quieto,
          # un commit vacío lo mantiene vivo ([skip render] = Render no redespliega por esto).
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45*86400 )) ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -q -m "Mantener activo el cron [skip ci] [skip render]"
            git push -q origin HEAD:${GITHUB_REF_NAME} && echo "Commit de mantenimiento hecho"
          fi

  buscar:
    needs: decidir
    if: needs.decidir.outputs.hay == 'true'
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 el 19/10/2026
    timeout-minutes: 330
    concurrency:            # una búsqueda a la vez (todas escriben la misma rama "datos")
      group: busqueda-vuelos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar historial (rama "datos")
        run: |
          # El historial vive en una rama aparte que se PISA en cada corrida (un solo commit),
          # así el repo no crece con una copia de la base por día.
          if git fetch --depth=1 origin datos 2>/dev/null; then
            mkdir -p data reportes
            git archive FETCH_HEAD | tar -x   # la rama solo tiene data/ y reportes/
            echo "Historial restaurado"
          else
            echo "Todavía no hay rama datos: primera corrida"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar precios, generar reportes y enviar alertas
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERTA_EMAILS: ${{ secrets.ALERTA_EMAILS || secrets.SMTP_USER }}   # por defecto, a tu propio Gmail
          VUELOS_CLAVE: ${{ secrets.VUELOS_CLAVE }}
          VUELOS_PROXY: ${{ secrets.VUELOS_PROXY }}
          VUELOS_URL_REPORTE: ${{ vars.VUELOS_URL_WEB }}
          VUELOS_URL_WEB: ${{ vars.VUELOS_URL_WEB }}
          VUELOS_MAX_CONSULTAS: ${{ vars.VUELOS_MAX_CONSULTAS }}
          # normal = 3 consultas en paralelo. Se frena sola si Google empieza a poner trabas (ritmo adaptativo);
          # en las primeras ~4.000 consultas desde la nube no hubo ni un error con prudente. Variable para cambiarlo.
          VUELOS_VELOCIDAD: ${{ vars.VUELOS_VELOCIDAD || 'normal' }}
          # los inputs se pasan por variables de entorno (nunca interpolados en el script: evita inyección)
          EVENTO: ${{ github.event_name }}
          IN_BUSQUEDA: ${{ inputs.busqueda }}
          IN_MODO: ${{ inputs.modo }}
          IN_PROVEEDOR: ${{ inputs.proveedor }}
        run: |
          args=(--no-abrir)
          if [ "$EVENTO" = "schedule" ] || [ "$IN_MODO" = "programado" ]; then
            args+=(--programado)
          else
            args+=(--forzar)
            [ -n "$IN_BUSQUEDA" ] && args+=(--busqueda "$IN_BUSQUEDA")
          fi
          [ -n "$IN_PROVEEDOR" ] && [ "$IN_PROVEEDOR" != "config" ] && args+=(--proveedor "$IN_PROVEEDOR")
          python -m src.main "${args[@]}"

      - name: Guardar historial y reportes (rama "datos", se pisa cada vez)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan datos-tmp
          git rm -rfq --cached . 2>/dev/null || true
          for f in data/historial.db data/estado.json data/muestra_google.html reportes; do [ -e "$f" ] && git add -f "$f"; done
          if git diff --cached --quiet; then echo "Nada para guardar"; exit 0; fi
          git commit -q -m "Datos $(date +'%Y-%m-%d %H:%M') [skip ci]"
          git push -f origin datos-tmp:datos

      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore
