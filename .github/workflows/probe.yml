name: Prueba navegador
on:
  push:
    branches: [prueba-navegador]
    paths: [probe.py, .github/workflows/probe.yml, src/**]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt playwright==1.49.1
      - run: rm -rf salida; python probe.py
      - run: |
          git config user.name bot; git config user.email bot@x
          git add -A salida; git commit -m "salida [skip ci]" -q; git push -q
